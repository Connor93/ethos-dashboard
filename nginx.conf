server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|bmp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Reverse proxy all /api/* requests to the etheos server
    # ETHEOS_API_URL and ETHEOS_API_KEY are replaced at deploy time by deploy.sh
    location /api/ {
        proxy_pass ETHEOS_API_URL;
        proxy_set_header X-Api-Key "ETHEOS_API_KEY";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        # Hold request bodies in memory rather than spilling to a temp file.
        # The default (8k/16k) was causing INI saves to be truncated upstream
        # of etheos — bodies above the buffer were spooled to a temp file and
        # something in that path was cutting them off mid-stream.
        client_body_buffer_size 1m;
    }

    # Reverse proxy /gfx/* to the em-web-client container which serves the
    # static EGF graphics files. Used by the pub editor's GFX preview.
    # WEBCLIENT_GFX_URL is replaced at deploy time by docker-entrypoint.sh.
    location /gfx/ {
        proxy_pass WEBCLIENT_GFX_URL;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        # EGFs cache aggressively — they only change when em-web-client
        # redeploys, and the dashboard reload is gated on user action.
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Reverse proxy /local-api/* to the backup sidecar that runs alongside nginx
    # in this container. The sidecar binds to 127.0.0.1, so it is only
    # reachable through nginx — we don't enforce auth at the sidecar layer
    # because anyone able to hit nginx already has dashboard access.
    location /local-api/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        # Same INI-safety reason as the /api/ block — keep large bodies
        # (a full INI file save) in memory rather than spilling to a temp file.
        client_body_buffer_size 1m;
    }

    # Handle SPA routing — fallback to index.html
    location / {
        rewrite ^(.+)/$ $1 permanent;
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
