name: Build, Push & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: 2222
          script: |
            set -e

            # Login to GHCR
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Ensure Traefik dynamic router exists
            mkdir -p ~/traefik/dynamic
            cat > ~/traefik/dynamic/etheos-dashboard.yml << 'EOF'
            http:
              routers:
                etheos-dashboard:
                  rule: "Host(`dashboard.calamity-online.cloud`)"
                  service: etheos-dashboard
                  entryPoints:
                    - websecure
                  tls:
                    certResolver: letsencrypt
              services:
                etheos-dashboard:
                  loadBalancer:
                    servers:
                      - url: "http://etheos-dashboard:80"
            EOF

            # Template the nginx config with the etheos server connection details
            mkdir -p ~/etheos-dashboard
            cd ~/etheos-dashboard

            cat > docker-compose.yml << 'EOF'
            services:
              etheos-dashboard:
                image: ghcr.io/connor93/etheos-dashboard:latest
                container_name: etheos-dashboard
                restart: unless-stopped
                networks:
                  - web
            networks:
              web:
                external: true
            EOF

            # Pull and recreate
            docker compose pull
            docker compose up -d --force-recreate

            # Template nginx.conf inside the running container with actual API URL and key
            ETHEOS_URL="${{ secrets.ETHEOS_API_URL }}"
            ETHEOS_KEY="${{ secrets.ETHEOS_API_KEY }}"

            # Replace placeholders in the nginx config inside the container
            docker exec etheos-dashboard sh -c "sed -i 's|ETHEOS_API_URL|${ETHEOS_URL}|g' /etc/nginx/conf.d/default.conf"
            docker exec etheos-dashboard sh -c "sed -i 's|ETHEOS_API_KEY|${ETHEOS_KEY}|g' /etc/nginx/conf.d/default.conf"
            docker exec etheos-dashboard nginx -s reload

            echo "✅ Etheos Dashboard deployed to dashboard.calamity-online.cloud"
